<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#13232A; --muted:#5D6E75; --line:#DCE4E6;
  --accent:#0B5868; --accent-soft:#E2EFF1; --accent-ink:#FFFFFF;
  --good:#1D7F55; --good-soft:#E3F3EB; --warn:#9A6512; --warn-soft:#FBF0DC; --bad:#B8401A; --bad-soft:#FBE7DF;
  --fd:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E171A; --surface:#152227; --ink:#E4ECEE; --muted:#93A6AD; --line:#26363C;
  --accent:#4FB3C4; --accent-soft:#173840; --accent-ink:#06191D;
  --good:#5BC994; --good-soft:#143326; --warn:#E3B05A; --warn-soft:#3A2C12; --bad:#F08A63; --bad-soft:#3D1F15; color-scheme:dark;}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance} h1{font-size:19px} h2{font-size:17px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 70px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{display:block;margin-top:5px}
.req{color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:11px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.p{background:var(--accent);color:var(--accent-ink)} .btn.g{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.d{background:transparent;color:var(--bad);border-color:var(--bad-soft)} .btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.big{width:100%;padding:26px 18px;font-size:21px;font-family:var(--fd);border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;display:grid;gap:4px;place-items:center;box-shadow:0 6px 18px rgba(11,88,104,.25)}
.big small{font-family:var(--fb);font-size:13px;font-weight:500;opacity:.85}
.big:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.xlbox{display:grid;gap:8px;border:1px dashed var(--line,#cbd5e1);border-radius:14px;padding:12px;background:rgba(16,185,129,.05)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative} .chip input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg)}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.banner{padding:11px 14px;border-radius:10px;font-size:14px}
.b-ok{background:var(--good-soft);color:var(--good)} .b-err{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--accent-soft);color:var(--accent)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .v{font-family:var(--fd);font-size:25px;font-weight:600} .kpi .l{color:var(--muted);font-size:13px}
.kpi.alert{box-shadow:inset -3px 0 0 var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px} .bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--good)} .bar.low i{background:var(--warn)}
.tw{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pg{background:var(--good-soft);color:var(--good)} .pw{background:var(--warn-soft);color:var(--warn)} .pb{background:var(--bad-soft);color:var(--bad)} .pn{background:var(--accent-soft);color:var(--accent)}
.live{border:2px solid var(--accent);background:var(--accent-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block;margin-inline-end:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end} .filters label.f{min-width:150px}
.two{display:grid;gap:16px;grid-template-columns:1.5fr 1fr} @media (max-width:860px){.two{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:140px 1fr 34px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.vlist{display:grid;gap:9px}
.vi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:5px}
.vi .r1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vi .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.loading{display:grid;place-items:center;padding:60px 10px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.org{display:grid;gap:6px}
.org-row{display:block}

const TYPE_AR={"Daily Allowance Full day":"بدل يومي كامل","Daily Allowance Half day":"بدل نصف يوم","Car Allowance 200- 300 K.M":"بدل سيارة 200–300 كم","Car Allowance up to 350 K.M":"بدل سيارة حتى 350 كم","Fuel":"وقود","Accommodation / Hotel":"سكن / فندق","Air Tickets":"تذاكر طيران","Taxi / Transportation":"مواصلات","Parking & Tolls":"مواقف ورسوم","Telephone & Internet":"اتصالات وإنترنت","Customer Hospitality":"ضيافة عملاء","Car Maintenance":"صيانة سيارة","Scientific Meeting / Training":"اجتماع علمي / تدريب","Conference / Exhibition Fees":"رسوم مؤتمر / معرض","Meal Allowance":"بدل وجبات","Visa Fees":"رسوم تأشيرة","Travel Insurance":"تأمين سفر","Other":"أخرى"};
const ST={draft:["مسودة","pn"],submitted:["بانتظار المراجعة","pw"],reviewed:["بانتظار الاعتماد","pw"],approved:["معتمد","pg"],returned:["مرجّع للتعديل","pb"]};
const HS={submitted:"اتبعت للمراجعة",reviewed:"اتراجع",approved:"اتعتمد",returned:"اترجّع للتعديل",edited:"اتعدّل من لوحة المدير",imported:"اترفع من Excel",reopened:"اتفتح تاني"};
const ROLE_REV="مراجع",ROLE_APP="معتمد نهائي",ROLE_EMP="موظف";
const f2=n=>(Math.round((Number(n)||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=n=>Math.round(Number(n)||0).toLocaleString("en-US");
const tl=t=>TYPE_AR[t]?`${esc(t)} <span class="muted small">· ${TYPE_AR[t]}</span>`:esc(t);
const pill=st=>`<span class="pill ${(ST[st]||ST.draft)[1]}">${(ST[st]||ST.draft)[0]}</span>`;
const mname=m=>m?MONTHS_AR[m-1]+" "+"("+MONTHS[m-1].slice(0,3)+")":"";
const fdt=iso=>{if(!iso)return"";const d=new Date(iso);return isNaN(d)?"":d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});};
let LISTS=null,RATES=null;
const S={init:null,me:null,pin:null,state:null,view:"home",mgrPin:null,dash:null,mtab:"sum",ed:null,f:{year:String(new Date().getFullYear()),month:"",status:"",emp:"",dept:"",q:""},empEdit:null,cfg:null};

function typesFor(travel){return travel==="International"?LISTS.intl:LISTS.dom;}
function fixedAmt(grade,travel,type){if(travel!=="Domestic")return null;const g=RATES.grades[grade]||RATES.grades.Staff||{};
  if(type==="Daily Allowance Full day")return Number(g.full)||0;if(type==="Daily Allowance Half day")return Number(g.half)||0;if(RATES.car&&type in RATES.car)return Number(RATES.car[type])||0;return null;}
function totalOf(lines){return (lines||[]).reduce((a,l)=>a+(Number(l.amount)||0),0);}

 
let HIST=[],CUR=null;
function navKey(){return JSON.stringify({v:S.view,m:S.mtab,e:S.ed?1:0});}
function goBack(fromPop){if(S.ed){S.ed=null;S._back=true;render();return;}if(S.empEdit){S.empEdit=null;render();return;}const p=HIST.pop();if(!p){if(!fromPop)toast("دي أول صفحة");return;}const o=JSON.parse(p);S._back=true;S.view=o.v;S.mtab=o.m;render();window.scrollTo(0,0);}
window.addEventListener("popstate",()=>goBack(true));
const IC={mine:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',queue:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',home:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',mgr:'<path d="M5 20V11M11 20V5M17 20v-6"/><path d="M3 20h18"/>'};
function drawNav(){
  const q=S.state&&S.state.queue?S.state.queue.length:0;const r=S.me&&S.me.role;
  const items=S.me?[["mine","شيتاتي"],...(r===ROLE_REV?[["queue","للمراجعة"]]:r===ROLE_APP?[["queue","للاعتماد"]]:[]),["mgr","لوحة المدير"]]:[["home","دخول الموظف"],["mgr","لوحة المدير"]];
  $("#nav").innerHTML=items.map(([k,t])=>`<button type="button" data-v="${k}" ${S.view===k?'aria-current="page"':""}><i class="nic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>${k==="queue"&&q?'<b class="ndot"></b>':""}</i><span>${t}${k==="queue"&&q?` (${q})`:""}</span></button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.ed=null;render();});
  $("#who").textContent=S.me?S.me.name:"HMC Diagnostics";
  const t=$("#tools");const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const inMgr=S.view==="mgr"&&S.mgrPin,inMe=S.view!=="mgr"&&S.me;
  t.innerHTML=(HIST.length||S.ed||S.empEdit?`<button type="button" class="tbtn bk" id="tBack" aria-label="رجوع" title="رجوع">${ic('<path d="M15 18l-6-6 6-6"/>')}</button>`:"")+
    (inMgr||inMe?`<button type="button" class="tbtn" id="tRef" aria-label="تحديث" title="تحديث">${ic('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>')}</button><button type="button" class="tbtn" id="tOut" aria-label="تسجيل خروج" title="تسجيل خروج">${ic('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/>')}</button>`:"");
  const b=$("#tBack");if(b)b.onclick=()=>{if(S.ed||S.empEdit||!HIST.length){goBack(false);return;}try{history.back();}catch(e){goBack(false);}};
  const rf=$("#tRef");if(rf)rf.onclick=()=>refreshAll(rf);const o=$("#tOut");if(o)o.onclick=()=>doLogout(o);
}
async function refreshAll(btn){if(btn){btn.classList.add("spin");btn.disabled=true;}
  try{const ini=await call("apiInit");S.init=ini;LISTS=ini.lists;RATES=ini.rates;
    if(S.view==="mgr"&&S.mgrPin){S.dash=await call("apiDash",S.mgrPin);S.cfg=null;}else if(S.me){S.state=await call("apiLogin",S.me.id,S.pin);S.me=S.state.me;}
    if(S.ed&&S.ed.x.id){const src=S.view==="mgr"?(S.dash.sheets.find(s=>s.id===S.ed.x.id)):(S.state.mine.concat(S.state.queue,S.state.done).find(s=>s.id===S.ed.x.id));if(src&&!S.ed.dirty)S.ed.x=JSON.parse(JSON.stringify(src));}
    render();toast("اتحدّث ✓");}catch(ex){toast(ex.message);}
  const b=$("#tRef");if(b){b.classList.remove("spin");b.disabled=false;}}
function doLogout(btn){if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.classList.add("warn");toast("اضغط تاني لتسجيل الخروج");setTimeout(()=>{btn.dataset.sure="";btn.classList.remove("warn");},3000);return;}
  if(S.view==="mgr"&&S.mgrPin){store.del("emgr");S.mgrPin=null;S.dash=null;S.cfg=null;S.view=S.me?"mine":"mgr";}
  else{store.del("eme");S.me=null;S.pin=null;S.state=null;S.view="home";}
  S.ed=null;HIST=[];CUR=null;render();toast("اتسجل الخروج");}

function render(){const nk=navKey();if(CUR&&nk!==CUR&&!S._back){HIST.push(CUR);if(HIST.length>30)HIST.shift();try{history.pushState({n:HIST.length},"");}catch(e){}}CUR=nk;S._back=false;
  drawNav();const a=$("#app");
  if(S.view==="mgr"){a.innerHTML=S.mgrPin&&S.dash?(S.ed?viewEditor():viewDash()):viewMgrLogin();bindAll();return;}
  if(!S.me){a.innerHTML=viewLogin();bindAll();return;}
  a.innerHTML=S.ed?viewEditor():S.view==="queue"?viewQueue():viewMine();bindAll();}

/* ---------- login ---------- */
function viewLogin(){const E=S.init.emps;const ds=[...new Set(E.map(e=>e.dept))];const d=S.ldept||ds[0]||"";
  return `<section class="card" style="max-width:480px;margin:10px auto;display:grid;gap:12px">
   <h2>دخول الموظف</h2><p class="muted small" style="margin:0">اختار القسم واسمك واكتب الرقم السري. هتدخل مرة واحدة بس على الموبايل ده.</p>
   ${ds.length>1?`<label class="f" for="lDept">القسم<select id="lDept">${ds.map(x=>`<option ${x===d?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`:""}
   <label class="f" for="lName">اسمك<select id="lName"><option value="">اختار اسمك…</option>${E.filter(e=>e.dept===d).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select></label>
   <label class="f" for="lPin">الرقم السري<input id="lPin" type="password" inputmode="numeric" autocomplete="current-password"></label>
   <div class="banner b-err" id="lErr" hidden></div>
   <button class="btn p" id="lGo" type="button" style="padding:14px">دخول</button>
   <button class="btn g sm" id="lForgot" type="button" style="justify-self:start">نسيت الرقم السري؟</button><div class="small muted" id="lMsg"></div></section>`;}
function viewMgrLogin(){return `<section class="card" style="max-width:420px;margin:10px auto;display:grid;gap:12px"><h2>لوحة المدير</h2>
   <label class="f" for="mPin">الرقم السري للمدير<input id="mPin" type="password" inputmode="numeric"></label><div class="banner b-err" id="mErr" hidden></div>
   <button class="btn p" id="mGo" type="button" style="padding:14px">دخول</button><button class="btn g sm" id="mForgot" type="button" style="justify-self:start">نسيت الرقم السري؟</button><div class="small muted" id="mMsg"></div></section>`;}

/* ---------- employee: my sheets ---------- */
function viewMine(){const st=S.state,me=S.me;const y=new Date().getFullYear();
  const ys=st.mine.filter(s=>s.year===y);const appr=ys.filter(s=>s.status==="approved").reduce((a,s)=>a+s.total,0);const pend=st.mine.filter(s=>s.status==="submitted"||s.status==="reviewed");
  const ret=st.mine.filter(s=>s.status==="returned");const now=new Date();
  return `<div class="hero"><div><small>${now.getHours()<12?"صباح الخير":"مساء الخير"} 👋</small><b>${esc(me.name)}</b><small>${esc(me.position||"")} · ${esc(me.dept)} · Grade: ${esc(me.grade)}</small></div></div>
   ${ret.length?`<div class="banner b-err">↩️ عندك ${ret.length} شيت مرجّع للتعديل — افتحه وشوف الملاحظة.</div>`:""}
   <div class="kpis"><div class="kpi"><div class="l">معتمد ${y} (ر.س)</div><div class="v num">${f0(appr)}</div></div><div class="kpi"><div class="l">قيد المراجعة</div><div class="v num">${pend.length}</div></div><div class="kpi"><div class="l">كل الشيتات</div><div class="v num">${st.mine.length}</div></div></div>
   <section class="card" style="display:grid;gap:12px"><h2>➕ شيت مصروفات جديد</h2>
    <div class="grid"><label class="f" for="nMonth">الشهر<select id="nMonth">${MONTHS.map((m,i)=>`<option value="${i+1}" ${i===now.getMonth()?"selected":""}>${MONTHS_AR[i]} — ${m}</option>`).join("")}</select></label>
     <label class="f" for="nYear">السنة<select id="nYear">${[y-1,y,y+1].map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></label>
     <label class="f" for="nTravel">نوع السفر<select id="nTravel"><option value="Domestic">داخلي — Domestic</option><option value="International">دولي — International</option></select></label></div>
    <button class="btn p" id="nGo" type="button">ابدأ الشيت</button>
    <div class="xlbox"><b>📗 تحب تملاه على Excel؟</b><div class="small muted">نزّل التمبلت جاهز ببياناتك والشهر اللي فوق، املا البنود، وارفعه هنا — هيتحوّل لشيت تراجعه وتبعته.</div>
     <div class="row"><button class="btn g" id="nTpl" type="button">⬇️ نزّل التمبلت</button><label class="btn g" for="nUp" style="cursor:pointer">📤 ارفع الشيت المتعبّي</label><input type="file" id="nUp" accept=".xlsx,.xls" hidden></div><div id="nUpMsg" class="small"></div></div></section>
   <section class="card"><div class="ch"><h2>شيتاتي</h2><span class="pill pn num">${st.mine.length}</span></div>
    ${st.mine.length?`<div class="vlist">${st.mine.map(sheetItem).join("")}</div>`:`<div class="empty">لسه مفيش شيتات — ابدأ أول شيت من فوق</div>`}</section>`;}
function sheetItem(s,who){return `<button type="button" class="vi prow" data-open="${esc(s.id)}" style="text-align:start;cursor:pointer;font:inherit;color:inherit">
  <div class="r1"><strong>${who?esc(s.empName)+" · ":""}${esc(mname(s.month))} ${s.year}${s.travel==="International"?" ✈️":""}</strong>${pill(s.status)}</div>
  <div class="meta num"><span>💰 ${f2(s.total)} ر.س</span><span>${s.nLines||s.lines.length} بند</span>${s.ref?`<span>${esc(s.ref)}</span>`:""}${s.city?`<span>📍 ${esc(s.city)}</span>`:""}</div>
  ${s.status==="returned"&&s.note?`<div class="small" style="color:var(--bad)">↩️ ${esc(s.note)}</div>`:""}</button>`;}

/* ---------- reviewer / approver queue ---------- */
function viewQueue(){const st=S.state,isApp=S.me.role===ROLE_APP;
  return `<section class="card"><div class="ch"><h2>${isApp?"✅ مستني اعتمادك":"📝 مستني مراجعتك"}</h2><span class="pill pw num">${st.queue.length}</span></div>
   <p class="small muted" style="margin-top:0">${isApp?"دي الشيتات اللي اتراجعت ومستنية الاعتماد النهائي.":"دي الشيتات اللي الموظفين بعتوها. بعد مراجعتك بتروح لد. سامي للاعتماد."}</p>
   ${st.queue.length?`<div class="vlist">${st.queue.map(s=>sheetItem(s,true)).join("")}</div>`:`<div class="empty">مفيش حاجة مستنياك دلوقتي 👌</div>`}</section>
   <section class="card"><div class="ch"><h2>آخر اللي اتعمل</h2></div>${st.done.length?`<div class="vlist">${st.done.map(s=>sheetItem(s,true)).join("")}</div>`:`<div class="empty">لسه مفيش</div>`}</section>`;}

/* ---------- editor ---------- */
function openSheet(x,mode){const c=JSON.parse(JSON.stringify(x));if(!c.lines.length&&(mode==="mgr"||c.status==="draft"||c.status==="returned"))c.lines.push({date:"",type:"",desc:"",amount:""});S.ed={x:c,mode,dirty:false};render();window.scrollTo(0,0);}
function empOf(id){if(S.dash)return S.dash.emps.find(e=>e.id===id);if(S.me&&S.me.id===id)return S.me;return S.ed&&S.ed.emp;}
function viewEditor(){const E=S.ed,x=E.x,mgr=E.mode==="mgr";
  const editable=mgr?true:(E.mode==="own"&&(x.status==="draft"||x.status==="returned"));
  const emp=mgr?(S.dash.emps.find(e=>e.id===x.emp)||{}):(E.mode==="own"?S.me:(E.emp||{}));
  const grade=emp.grade||"Staff",types=typesFor(x.travel);const dis=editable?"":"disabled";
  const areas=Object.keys(LISTS.areas||{});const cities=(LISTS.areas||{})[x.area]||[];
  const canDecide=E.mode==="queue"&&((S.me.role===ROLE_REV&&x.status==="submitted")||(S.me.role===ROLE_APP&&x.status==="reviewed"));
  const bt={};x.lines.forEach(l=>{if(l.type)bt[l.type]=(bt[l.type]||0)+(Number(l.amount)||0);});const tot=totalOf(x.lines);
  const banner=x.status==="returned"?`<div class="banner b-err">↩️ اترجّع للتعديل${x.note?": <b>"+esc(x.note)+"</b>":""}. عدّل وابعته تاني.</div>`:x.status==="approved"?`<div class="banner b-ok">🎉 الشيت ده معتمد نهائي${x.approvedBy?" — "+esc(x.approvedBy):""}.</div>`:(!editable&&E.mode==="own")?`<div class="banner b-info">الشيت ده مع المراجعين، فهو مقفول للتعديل.</div>`:"";
  return `<section class="card" style="display:grid;gap:12px">
   <div class="ch" style="margin:0"><h2>${x.id?esc(x.empName||emp.name||"")+" — "+esc(mname(x.month))+" "+x.year:"شيت جديد"}</h2>${pill(x.status||"draft")}</div>
   ${banner}
   <div class="grid">
    ${mgr?`<label class="f" for="xEmp">الموظف<select id="xEmp" ${x.id?"disabled":""}><option value="">اختار…</option>${S.dash.emps.filter(e=>e.active||e.id===x.emp).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${esc(e.id)}" ${e.id===x.emp?"selected":""}>${esc(e.name)}</option>`).join("")}</select></label>`:`<div class="f"><span class="small muted" style="font-weight:600">الموظف</span><div style="padding-top:6px"><b>${esc(emp.name||x.empName||"")}</b><div class="small muted">${esc(emp.position||"")} · Grade: ${esc(grade)}</div></div></div>`}
    <label class="f" for="xMonth">الشهر<select id="xMonth" ${dis}>${MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===x.month?"selected":""}>${MONTHS_AR[i]} — ${m}</option>`).join("")}</select></label>
    <label class="f" for="xYear">السنة<input id="xYear" type="number" value="${x.year}" ${dis}></label>
    <label class="f" for="xTravel">نوع السفر<select id="xTravel" ${dis}><option value="Domestic" ${x.travel!=="International"?"selected":""}>داخلي — Domestic</option><option value="International" ${x.travel==="International"?"selected":""}>دولي — International</option></select></label>
    <label class="f" for="xArea">المنطقة <span class="req">*</span><select id="xArea" ${dis}><option value="">اختار…</option>${areas.map(a=>`<option ${a===x.area?"selected":""}>${esc(a)}</option>`).join("")}</select></label>
    <label class="f" for="xCity">المدينة <span class="req">*</span><select id="xCity" ${dis}><option value="">اختار…</option>${cities.concat(x.city&&!cities.includes(x.city)?[x.city]:[]).map(c=>`<option ${c===x.city?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
   </div></section>
  <section class="card" style="display:grid;gap:10px"><div class="ch" style="margin:0"><h2>البنود</h2><span class="pill pn num">${x.lines.length}</span></div>
   ${x.travel==="Domestic"?`<div class="small muted">البدل اليومي وبدل السيارة بيتحسبوا لوحدهم حسب الدرجة (${esc(grade)}): يوم كامل ${f0((RATES.grades[grade]||{}).full)} · نص يوم ${f0((RATES.grades[grade]||{}).half)} ر.س</div>`:""}
   <div class="lines">${x.lines.map((l,i)=>{const fx=fixedAmt(grade,x.travel,l.type);return `<div class="ln">
     <span class="lno num">${i+1}</span>
     <input type="date" data-l="${i}" data-k="date" value="${esc(l.date||"")}" ${dis} aria-label="تاريخ الفاتورة">
     <select data-l="${i}" data-k="type" ${dis} aria-label="نوع المصروف"><option value="">نوع المصروف…</option>${types.concat(l.type&&!types.includes(l.type)?[l.type]:[]).map(t=>`<option value="${esc(t)}" ${t===l.type?"selected":""}>${esc(t)}${TYPE_AR[t]?" · "+TYPE_AR[t]:""}</option>`).join("")}</select>
     <input data-l="${i}" data-k="desc" value="${esc(l.desc||"")}" placeholder="الوصف / ملاحظات" ${dis} aria-label="الوصف">
     <input data-l="${i}" data-k="amount" type="number" step="0.01" min="0" inputmode="decimal" value="${l.amount===""||l.amount==null?"":l.amount}" placeholder="المبلغ" ${dis||fx!=null?"disabled":""} class="num" aria-label="المبلغ">
     ${editable?`<button type="button" class="btn d sm" data-del="${i}" aria-label="مسح البند">✕</button>`:""}</div>`;}).join("")}</div>
   ${editable?`<button type="button" class="btn g" id="xAdd">+ بند جديد</button>
   <div class="row"><button type="button" class="btn g sm" id="xTpl">⬇️ تمبلت Excel</button><label class="btn g sm" for="xUp" style="cursor:pointer">📤 رفع من Excel</label><input type="file" id="xUp" accept=".xlsx,.xls" hidden><span class="small muted">الرفع بيستبدل البنود اللي فوق</span></div>
   <div class="row"><button type="button" class="btn g sm" id="xVis">📍 هات أيام زياراتي من نبض الميدان</button></div><div id="xVisBox"></div>`:""}
   <div class="tot"><span>الإجمالي TOTAL</span><b class="num">${f2(tot)} ر.س</b></div>
   ${Object.keys(bt).length?`<div class="tw"><table><tbody>${Object.entries(bt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${tl(k)}</td><td class="num" style="text-align:end">${f2(v)}</td></tr>`).join("")}</tbody></table></div>`:""}

let TPL64=null;
async function downloadTemplate(emp,sh){await loadJSZip();if(!TPL64)TPL64=await call("apiTemplate");
  const zip=await JSZip.loadAsync(TPL64,{base64:true});await fillTplZip(zip,emp||{},sh||{},RATES,MONTHS);
  const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const name=`Expense - ${(emp&&emp.name)||"HMC"} - ${MONTHS[((sh&&sh.month)||1)-1]} ${(sh&&sh.year)||""}${sh&&sh.travel==="International"?" International":""}.xlsx`;
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},4000);}
function normType(t,travel){const all=(travel==="International"?LISTS.intl:LISTS.dom).concat(LISTS.dom,LISTS.intl);const k=String(t||"").trim().toLowerCase().replace(/\s+/g," ");return all.find(x=>x.toLowerCase().replace(/\s+/g," ")===k)||String(t||"").trim();}
async function readFilled(file){const d=parseExpense(await readWb(file),file);if(!d.lines.length)throw new Error("الملف مفيهوش بنود — املا عمود نوع المصروف وارفعه تاني");
  d.lines=d.lines.map(l=>({date:l.date,type:normType(l.type,d.travel),desc:l.desc,amount:l.amount}));return d;}
function applyFilled(x,d,grade){if(d.month)x.month=d.month;if(d.year)x.year=d.year;x.travel=d.travel;if(d.area)x.area=d.area;if(d.city)x.city=d.city;
  x.lines=d.lines.map(l=>{const fx=fixedAmt(grade||"Staff",x.travel,l.type);return {...l,amount:fx!=null?fx:l.amount};});}
function loadXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("مقدرناش نحمّل أداة Excel — اتأكد من الإنترنت"));document.head.appendChild(s);});}
async function readWb(file){await loadXLSX();const buf=await file.arrayBuffer();return XLSX.read(buf,{cellDates:true});}
function cv(ws,a){const c=ws[a];return c?(c.v instanceof Date?c.v:c.v):"";}
function ymd(d){if(!(d instanceof Date)||isNaN(d))return "";d=new Date(d.getTime()+43200000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseExpense(wb,file){const ws=wb.Sheets["Expense Sheet"]||wb.Sheets[wb.SheetNames[0]];const mon=String(cv(ws,"F8")).trim();let m=MONTHS.findIndex(x=>x.toLowerCase()===mon.toLowerCase())+1;if(!m&&Number(mon))m=Number(mon);
  const lines=[];for(let r=15;r<=150;r++){const b=String(cv(ws,"B"+r)).trim().toUpperCase();if(b.startsWith("TOTAL"))break;const type=String(cv(ws,"D"+r)).trim();if(!type)continue;const dv=cv(ws,"C"+r);
    lines.push({date:dv instanceof Date?ymd(dv):String(dv||"").slice(0,10),type,desc:String(cv(ws,"E"+r)||"").trim(),amount:Number(cv(ws,"F"+r))||0});}
  return {file:file.name,empName:String(cv(ws,"D7")).trim(),area:String(cv(ws,"F6")).trim(),city:String(cv(ws,"F7")).trim(),month:m,year:Number(cv(ws,"F9"))||new Date().getFullYear(),travel:String(cv(ws,"D13")).trim()==="International"?"International":"Domestic",lines};}
async function exportXlsx(){await loadXLSX();const L=filtered();const wb=XLSX.utils.book_new();
  const grp=fn=>{const m={};L.forEach(s=>fn(s).forEach(([k,v])=>{m[k]=m[k]||{n:0,t:0};m[k].n++;m[k].t+=v;}));return Object.entries(m).sort((a,b)=>b[1].t-a[1].t);};
  const sec=(t,rows)=>[[t],["Item","Count","Total (SAR)"],...rows.map(([k,o])=>[k,o.n,o.t]),[]];
  const sum=[["EXPENSES SUMMARY — HMC Diagnostics"],[(S.f.month?MONTHS[S.f.month-1]+" ":"")+(S.f.year||"All years")],[],["GRAND TOTAL (SAR)",L.reduce((a,s)=>a+s.total,0)],["No. of sheets",L.length],[],
    ...sec("By employee",grp(s=>[[s.empName,s.total]])),...sec("By expense type",grp(s=>s.lines.map(l=>[l.type,Number(l.amount)||0]))),...sec("By area",grp(s=>[[s.area||"Not set",s.total]])),...sec("By month",grp(s=>[[MONTHS[s.month-1]||"",s.total]])),...sec("By travel",grp(s=>[[s.travel,s.total]]))];
  const w1=XLSX.utils.aoa_to_sheet(sum);w1["!cols"]=[{wch:34},{wch:10},{wch:16}];XLSX.utils.book_append_sheet(wb,w1,"Summary");
  const sh=[["Ref","Employee","Department","Area","City","Month","Year","Travel","Status","Items","Total (SAR)","Reviewed by","Approved by"],...L.map(s=>[s.ref,s.empName,s.dept,s.area,s.city,MONTHS[s.month-1]||"",s.year,s.travel,(ST[s.status]||[])[0],s.lines.length,s.total,s.reviewedBy,s.approvedBy])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sh),"Sheets");
  const ln=[["Ref","Employee","Month","Year","Invoice date","Expense type","Description","Amount (SAR)","Status"]];L.forEach(s=>s.lines.forEach(l=>ln.push([s.ref,s.empName,MONTHS[s.month-1]||"",s.year,l.date,l.type,l.desc,Number(l.amount)||0,(ST[s.status]||[])[0]])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ln),"Lines");
  XLSX.writeFile(wb,`HMC Expenses ${S.f.year||"All"}${S.f.month?"-"+String(S.f.month).padStart(2,"0"):""}.xlsx`);}

  const ep=$("#ePin");if(ep)ep.onclick=async()=>{try{const p=await call("apiGetPin",S.mgrPin,S.empEdit.id);$("#eMsg").innerHTML=`🔑 الرقم السري: <b dir="ltr" style="font-size:18px">${esc(p)}</b>`;}catch(ex){toast(ex.message);}};
  const eo=$("#eOff");if(eo)eo.onclick=async()=>{const d={...S.empEdit,active:S.empEdit.active===false};eo.disabled=true;try{await call("apiSaveEmployee",S.mgrPin,d);S.dash=await call("apiDash",S.mgrPin);S.empEdit=null;render();toast("تم ✓");}catch(ex){toast(ex.message);eo.disabled=false;}};
  const ed=$("#eDel");if(ed)ed.onclick=async()=>{if(ed.dataset.sure!=="1"){ed.dataset.sure="1";ed.textContent="متأكد؟ اضغط تاني";return;}ed.disabled=true;try{await call("apiDeleteEmployee",S.mgrPin,S.empEdit.id);S.dash=await call("apiDash",S.mgrPin);S.empEdit=null;render();toast("اتمسح");}catch(ex){$("#eMsg").textContent=ex.message;ed.disabled=false;}};
  const ie=$("#impEmp");if(ie)ie.onchange=async()=>{const m=$("#impEmpMsg");m.textContent="جارِ القراءة…";try{const wb=await readWb(ie.files[0]);const ws=wb.Sheets["Employees"]||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
    const list=rows.map(r=>({name:String(r["Name"]||"").trim(),position:r["Position"],dept:r["Department"],mobile:String(r["Mobile"]||""),email:r["Email"],empNo:String(r["Employer No."]||""),iban:r["IBAN"],grade:r["Grade"]||"Staff"})).filter(r=>r.name);
    const r=await call("apiImportEmployees",S.mgrPin,list);S.dash=await call("apiDash",S.mgrPin);m.innerHTML=`<div class="banner b-ok">✓ اتضاف ${r.added} واتحدّث ${r.updated}</div>`;}catch(ex){m.textContent=ex.message;}};
  const is=$("#impSh");if(is)is.onchange=async()=>{const m=$("#impShMsg");m.textContent="جارِ القراءة…";try{const list=[];for(const f of is.files){list.push(parseExpense(await readWb(f),f));}
    const r=await call("apiImportSheets",S.mgrPin,list);S.dash=await call("apiDash",S.mgrPin);m.innerHTML=r.map(x=>x.ok?`<div class="banner b-ok" style="margin-top:6px">✓ ${esc(x.file)} — ${esc(x.emp)} · ${x.lines} بند · ${f2(x.total)} ر.س${x.updated?" (اتحدّث)":""}</div>`:`<div class="banner b-err" style="margin-top:6px">✕ ${esc(x.file)} — ${esc(x.error)}</div>`).join("");}catch(ex){m.textContent=ex.message;}};
  // settings
  if(S.cfg&&$("#sSave")){const C=S.cfg;
    const ga=$("#gAdd");if(ga)ga.onclick=()=>{readSettings();C.rates.grades["New grade"]={full:0,half:0};render();};
    document.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>{readSettings();const k=Object.keys(C.rates.grades)[+b.dataset.gdel];delete C.rates.grades[k];render();});
    const aa=$("#aAdd");if(aa)aa.onclick=()=>{const n=$("#newArea").value.trim();if(!n)return;readSettings();C.lists.areas[n]=C.lists.areas[n]||["—"];render();};
    $("#sSave").onclick=async()=>{readSettings();const b=$("#sSave");b.disabled=true;try{const c=await call("apiSaveSettings",S.mgrPin,C);S.cfg=c;S.mgrPin=c.managerPin;store.set("emgr",c.managerPin);LISTS=c.lists;RATES=c.rates;S.dash=await call("apiDash",S.mgrPin);render();toast("اتحفظ ✓");}catch(ex){$("#sMsg").textContent=ex.message;b.disabled=false;}};}
}

(async()=>{
  if(false){$("#app").innerHTML=`<div class="card">افتح المنصة من رابط الـ Web App.</div>`;return;}
  try{S.init=await call("apiInit");LISTS=S.init.lists;RATES=S.init.rates;if(S.init.appName){$("#appName").textContent=S.init.appName;document.title=S.init.appName+" — HMC Diagnostics";}if(S.init.logo){$("#logo").src=S.init.logo;$("#logo").style.display="block";$("#mark").style.display="none";}}
  catch(e){$("#app").innerHTML=`<div class="banner b-err">مقدرناش نحمّل المنصة: ${esc(e.message)}</div>`;return;}
  const sv=store.get("eme");if(sv){try{const st=await call("apiLogin",sv.id,sv.pin);S.state=st;S.me=st.me;S.pin=sv.pin;S.view=st.queue.length?"queue":"mine";}catch(e){store.del("eme");}}
  const mp=store.get("emgr");if(mp&&!S.me){try{S.dash=await call("apiDash",mp);S.mgrPin=mp;S.view="mgr";LISTS=S.dash.lists;RATES=S.dash.rates;}catch(e){store.del("emgr");}}
  render();
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
